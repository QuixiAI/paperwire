[package]
name = "postal-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
keyring = "4.2.0"
lopdf = { version = "0.47.0", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart", "form"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
